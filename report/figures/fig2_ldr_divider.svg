<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="Liberation Sans, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4a017"/>
    </marker>
    <style>
      .w { stroke: #1c2430; stroke-width: 1.6; fill: none; }
      .lbl { fill: #1c2430; }
      .v { fill: #1f4e8c; font-weight: bold; }
      .eq { font-size: 13px; fill: #1c2430; }
      .note { font-size: 11px; fill: #555; }
    </style>
  </defs>
  <!-- +5 V -->
  <text x="120" y="22" text-anchor="middle" class="v">+5 V (Arduino 5V pin)</text>
  <path class="w" d="M120,30 V50"/>
  <!-- LDR: zigzag 50..114 with circle -->
  <path class="w" d="M120,50 l0,8 l8,4 l-16,8 l16,8 l-16,8 l16,8 l-16,8 l8,4 l0,8"/>
  <circle cx="120" cy="82" r="26" fill="none" stroke="#1c2430" stroke-width="1.2"/>
  <path d="M70,52 l26,16" stroke="#d4a017" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M66,68 l26,16" stroke="#d4a017" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="160" y="78" class="lbl">R<tspan dy="4" font-size="9">LDR</tspan></text>
  <text x="160" y="96" class="note">GL5528-type CdS cell</text>
  <!-- node -->
  <path class="w" d="M120,114 V140"/>
  <circle cx="120" cy="140" r="3.5" fill="#1c2430"/>
  <path class="w" d="M120,140 H230"/>
  <circle cx="234" cy="140" r="4" fill="#fff" stroke="#1c2430" stroke-width="1.6"/>
  <text x="244" y="144" class="v">A0 (ADC input)</text>
  <!-- fixed resistor 10k: 166..230 -->
  <path class="w" d="M120,140 V166"/>
  <path class="w" d="M120,166 l0,8 l8,4 l-16,8 l16,8 l-16,8 l16,8 l-16,8 l8,4 l0,8"/>
  <text x="140" y="202" class="lbl">R = 10 kΩ</text>
  <!-- ground -->
  <path class="w" d="M120,230 V252"/>
  <path class="w" d="M102,252 H138 M108,258 H132 M114,264 H126"/>
  <text x="120" y="282" text-anchor="middle" class="lbl">GND</text>
  <!-- equations -->
  <text x="300" y="196" class="eq">V<tspan dy="4" font-size="9">A0</tspan><tspan dy="-4"> = 5 V · R / (R</tspan><tspan dy="4" font-size="9">LDR</tspan><tspan dy="-4"> + R)</tspan></text>
  <text x="300" y="222" class="eq">N = 1024 · V<tspan dy="4" font-size="9">A0</tspan><tspan dy="-4"> / V</tspan><tspan dy="4" font-size="9">REF</tspan><tspan dy="-4">  (0 … 1023)</tspan></text>
  <text x="300" y="250" class="note">More light → R<tspan dy="3" font-size="8">LDR</tspan><tspan dy="-3"> falls → V</tspan><tspan dy="3" font-size="8">A0</tspan><tspan dy="-3"> and N rise.</tspan></text>
</svg>
