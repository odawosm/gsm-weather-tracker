<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" font-family="Liberation Sans, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2430"/>
    </marker>
    <style>
      .box { fill: #eef1f5; stroke: #1c2430; stroke-width: 1.2; }
      .core { fill: #dbe6f5; stroke: #1f4e8c; stroke-width: 1.6; }
      .pwr { fill: #fbeee6; stroke: #a0522d; stroke-width: 1.2; }
      .net { fill: #e8f4ea; stroke: #2e7d32; stroke-width: 1.2; }
      .t { font-weight: bold; }
      .s { font-size: 10.5px; fill: #444; }
      .l { stroke: #1c2430; stroke-width: 1.3; fill: none; }
      .lp { stroke: #a0522d; stroke-width: 1.6; fill: none; }
      .lbl { font-size: 10px; fill: #1f4e8c; }
    </style>
  </defs>

  <!-- Sensors -->
  <rect class="box" x="20" y="20" width="200" height="46" rx="5"/>
  <text x="120" y="39" text-anchor="middle" class="t">DHT11</text>
  <text x="120" y="55" text-anchor="middle" class="s">temperature + humidity (1-wire, D2)</text>
  <rect class="box" x="20" y="80" width="200" height="46" rx="5"/>
  <text x="120" y="99" text-anchor="middle" class="t">LDR + 10 kΩ divider</text>
  <text x="120" y="115" text-anchor="middle" class="s">light level (analog, A0)</text>
  <rect class="box" x="20" y="140" width="200" height="46" rx="5"/>
  <text x="120" y="159" text-anchor="middle" class="t">Rain plate + LM393 board</text>
  <text x="120" y="175" text-anchor="middle" class="s">analog A1, powered from D4</text>

  <!-- Arduino -->
  <rect class="core" x="290" y="20" width="200" height="166" rx="6"/>
  <text x="390" y="62" text-anchor="middle" class="t" font-size="14">Arduino Uno</text>
  <text x="390" y="80" text-anchor="middle" class="s">ATmega328P, 16 MHz</text>
  <text x="390" y="104" text-anchor="middle" class="s">reads sensors every 5 s</text>
  <text x="390" y="120" text-anchor="middle" class="s">answers SMS commands</text>
  <text x="390" y="136" text-anchor="middle" class="s">trend + alert logic</text>
  <text x="390" y="152" text-anchor="middle" class="s">JSON line per reading</text>

  <!-- Outputs / GSM -->
  <rect class="box" x="560" y="20" width="200" height="46" rx="5"/>
  <text x="660" y="39" text-anchor="middle" class="t">SSD1306 OLED</text>
  <text x="660" y="55" text-anchor="middle" class="s">128×64, I²C 0x3C (A4/A5)</text>
  <rect class="box" x="560" y="80" width="200" height="46" rx="5"/>
  <text x="660" y="99" text-anchor="middle" class="t">Logic level shifter</text>
  <text x="660" y="115" text-anchor="middle" class="s">BSS138, 5 V ↔ low-voltage side</text>
  <rect class="box" x="560" y="140" width="200" height="46" rx="5"/>
  <text x="660" y="159" text-anchor="middle" class="t">SIM800L GSM module</text>
  <text x="660" y="175" text-anchor="middle" class="s">2G quad-band, AT commands</text>

  <!-- Row 2 -->
  <rect class="box" x="20" y="230" width="200" height="46" rx="5"/>
  <text x="120" y="249" text-anchor="middle" class="t">Laptop dashboard</text>
  <text x="120" y="265" text-anchor="middle" class="s">Python, Flask, pyserial, SQLite</text>
  <rect class="net" x="290" y="230" width="200" height="46" rx="5"/>
  <text x="390" y="249" text-anchor="middle" class="t">GSM network (2G)</text>
  <text x="390" y="265" text-anchor="middle" class="s">Safaricom, SMS centre (SMSC)</text>
  <rect class="pwr" x="560" y="230" width="200" height="46" rx="5"/>
  <text x="660" y="249" text-anchor="middle" class="t">LM2596 buck converter</text>
  <text x="660" y="265" text-anchor="middle" class="s">12 V → 4.0 V, + 1000 µF capacitor</text>

  <!-- Row 3 -->
  <rect class="net" x="20" y="316" width="200" height="46" rx="5"/>
  <text x="120" y="335" text-anchor="middle" class="t">Open-Meteo API</text>
  <text x="120" y="351" text-anchor="middle" class="s">online weather + forecast</text>
  <rect class="box" x="290" y="316" width="200" height="46" rx="5"/>
  <text x="390" y="335" text-anchor="middle" class="t">Approved users' phones</text>
  <text x="390" y="351" text-anchor="middle" class="s">WEATHER / STATUS / HELP, alerts</text>
  <rect class="pwr" x="560" y="316" width="200" height="46" rx="5"/>
  <text x="660" y="335" text-anchor="middle" class="t">Bench power supply</text>
  <text x="660" y="351" text-anchor="middle" class="s">12 V, current limit ≥ 2 A</text>

  <!-- Row 4 -->
  <rect class="box" x="290" y="402" width="200" height="46" rx="5" stroke-dasharray="5 3"/>
  <text x="390" y="421" text-anchor="middle" class="t">Android phone (backup)</text>
  <text x="390" y="437" text-anchor="middle" class="s">"SMS Gateway for Android" app</text>

  <!-- Sensor links -->
  <path class="l" d="M220,43 H288" marker-end="url(#a)"/>
  <path class="l" d="M220,103 H288" marker-end="url(#a)"/>
  <path class="l" d="M220,163 H288" marker-end="url(#a)"/>
  <!-- Arduino to OLED and shifter -->
  <path class="l" d="M490,43 H558" marker-end="url(#a)"/>
  <text x="524" y="38" text-anchor="middle" class="lbl">I²C</text>
  <path class="l" d="M492,103 H558" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="524" y="98" text-anchor="middle" class="lbl">UART</text>
  <path class="l" d="M660,128 V138" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- SIM800L to network (radio) -->
  <path class="l" d="M590,186 V205 H470 V228" marker-start="url(#a)" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <text x="530" y="200" text-anchor="middle" class="lbl">radio</text>
  <!-- network to phones -->
  <path class="l" d="M390,278 V314" marker-start="url(#a)" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <text x="396" y="300" class="lbl">SMS</text>
  <!-- Android to network -->
  <path class="l" d="M490,425 H510 V253 H492" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <!-- Android to laptop (Wi-Fi) -->
  <path class="l" d="M290,425 H245 V253 H222" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="250" y="390" class="lbl">Wi-Fi</text>
  <text x="250" y="402" class="lbl">HTTP</text>
  <!-- Arduino to laptop USB -->
  <path class="l" d="M330,188 V205 H120 V228" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="200" y="200" text-anchor="middle" class="lbl">USB serial, 9600 baud</text>
  <!-- Laptop to Open-Meteo -->
  <path class="l" d="M120,278 V314" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="126" y="300" class="lbl">HTTPS</text>
  <!-- Power -->
  <path class="lp" d="M700,316 V278" marker-end="url(#a)"/>
  <path class="lp" d="M700,230 V188" marker-end="url(#a)"/>
  <text x="706" y="212" class="lbl" fill="#a0522d">4.0 V</text>
  <text x="706" y="300" class="lbl" fill="#a0522d">12 V</text>
</svg>
